[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",     # HTTP-клиент Parser Service (CoinGecko, ExchangeRate-API)
    "prettytable>=3.10",  # форматированные таблицы (show-rates)
]

[dependency-groups]
dev = [
    "ruff>=0.8",          # линтер и форматер
]

[project.scripts]
valutatrade-hub = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

# ---------------------------------------------------------------------------
# Ruff: линтер и форматер (uv run ruff check . && uv run ruff format --check .)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: ошибки
    "W",   # pycodestyle: предупреждения
    "F",   # pyflakes (в т.ч. F821 — неопределённые имена)
    "I",   # isort: сортировка импортов
    "UP",  # pyupgrade: современный синтаксис
    "B",   # flake8-bugbear: вероятные баги
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PYI", # flake8-pyi: аннотации типов
    "RUF", # ruff-specific правила
]
ignore = [
    # Русскоязычный проект: ё/«»/— и стрелки → в строках, докстрингах и
    # комментариях регулярно дают ложные срабатывания «ambiguous character».
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["valutatrade_hub"]

# ---------------------------------------------------------------------------
# Конфигурация приложения (читается синглтоном SettingsLoader).
# Любой ключ можно переопределить переменной окружения VALUTATRADE_<KEY>.
# ---------------------------------------------------------------------------
[tool.valutatrade]
data_dir = "data"                 # каталог JSON-хранилищ
logs_dir = "logs"                 # каталог логов
rates_ttl_seconds = 300           # сколько секунд кеш курсов считается свежим
default_base_currency = "USD"     # базовая валюта по умолчанию
log_level = "INFO"                # уровень логирования (для отладки — DEBUG)
log_max_bytes = 1048576           # размер logs/actions.log до ротации (1 МБ)
log_backup_count = 3              # количество файлов ротации
