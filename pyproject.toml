[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
valutatrade-hub = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

# ---------------------------------------------------------------------------
# Конфигурация приложения (читается синглтоном SettingsLoader).
# Любой ключ можно переопределить переменной окружения VALUTATRADE_<KEY>.
# ---------------------------------------------------------------------------
[tool.valutatrade]
data_dir = "data"                 # каталог JSON-хранилищ
logs_dir = "logs"                 # каталог логов
rates_ttl_seconds = 300           # сколько секунд кеш курсов считается свежим
default_base_currency = "USD"     # базовая валюта по умолчанию
log_level = "INFO"                # уровень логирования (для отладки — DEBUG)
log_max_bytes = 1048576           # размер logs/actions.log до ротации (1 МБ)
log_backup_count = 3              # количество файлов ротации
